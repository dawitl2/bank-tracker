<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="glass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="wall" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <!-- Ground -->
  <rect y="380" width="800" height="120" fill="#0f172a"/>
  <line x1="0" y1="380" x2="800" y2="380" stroke="#f59e0b" stroke-width="2" stroke-opacity="0.4"/>
  
  <!-- Architectural House Silhouette -->
  <!-- Main building block -->
  <polygon points="180,380 180,210 440,160 440,380" fill="url(#wall)"/>
  <!-- Left wing -->
  <polygon points="120,380 120,260 220,240 220,380" fill="#94a3b8"/>
  <!-- Upper cantilever block -->
  <polygon points="340,260 620,210 620,120 340,170" fill="url(#accent)"/>
  <!-- Large picture window -->
  <polygon points="360,245 590,205 590,140 360,180" fill="url(#glass)"/>
  <!-- Window mullions -->
  <line x1="475" y1="225" x2="475" y2="160" stroke="#ffffff" stroke-width="2" stroke-opacity="0.7"/>
  <!-- Lower windows -->
  <rect x="220" y="270" width="70" height="80" fill="url(#glass)" rx="4"/>
  <rect x="310" y="270" width="100" height="80" fill="url(#glass)" rx="4"/>
  <!-- Doorway -->
  <rect x="235" y="300" width="40" height="80" fill="#334155"/>
  <!-- Modern lighting accents -->
  <circle cx="230" cy="290" r="3" fill="#fbbf24"/>
  <circle cx="430" cy="250" r="3" fill="#fbbf24"/>
  <line x1="120" y1="380" x2="680" y2="380" stroke="#475569" stroke-width="1"/>
  <!-- Architectural Grid lines -->
  <line x1="100" y1="100" x2="100" y2="400" stroke="#475569" stroke-width="1" stroke-dasharray="4 8" stroke-opacity="0.25"/>
  <line x1="700" y1="100" x2="700" y2="400" stroke="#475569" stroke-width="1" stroke-dasharray="4 8" stroke-opacity="0.25"/>
  <line x1="50" y1="150" x2="750" y2="150" stroke="#475569" stroke-width="1" stroke-dasharray="4 8" stroke-opacity="0.25"/>
</svg>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />

  <link rel="icon" href="/logoTop.png" />

  <!-- ✅ PWA -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="white" />

  <!-- iPhone support -->
  <link rel="apple-touch-icon" href="/logoTopApl.png" />

  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Bank Tracker</title>
  <style>
    #app-launch { position: fixed; inset: 0; z-index: 2147483647; display: none; place-items: center; background: #fff; transition: opacity 200ms ease; }
    #app-launch.is-ready { opacity: 0; pointer-events: none; }
    .launch-mark { width: 112px; height: 112px; position: relative; animation: launch-breathe 2400ms cubic-bezier(.4,0,.2,1) infinite; }
    .launch-mark img { display: block; width: 100%; height: 100%; object-fit: contain; }
    .launch-mark::after { content: ''; position: absolute; inset: 0; background: linear-gradient(115deg, transparent 35%, rgb(255 255 255 / 65%) 50%, transparent 65%); background-size: 300% 100%; -webkit-mask: url('/logoTop.png') center / contain no-repeat; mask: url('/logoTop.png') center / contain no-repeat; animation: launch-light 2400ms cubic-bezier(.4,0,.2,1) infinite; }
    @keyframes launch-breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.035); } }
    @keyframes launch-light { 0%,15% { background-position: 100% 0; opacity: 0; } 30% { opacity: 1; } 70%,100% { background-position: 0 0; opacity: 0; } }
    @media (display-mode: standalone), (display-mode: fullscreen) { #app-launch { display: grid; } }
    html.is-installed #app-launch { display: grid; }
    html.is-receipt #app-launch { display: none !important; }
    @media (prefers-reduced-motion: reduce) { .launch-mark, .launch-mark::after { animation: none; } .launch-mark::after { display: none; } #app-launch { transition: none; } }
  </style>
  <script>
    if (navigator.standalone) document.documentElement.classList.add('is-installed');
    if (/\/slip\/?$/.test(location.pathname)) {
      document.title = 'Receipt';
      document.documentElement.classList.add('is-receipt');
    }
  </script>
</head>
  
  <body>
    <div id="app-launch" role="status" aria-label="Opening Bank Tracker">
      <div class="launch-mark"><img src="/logoTop.png" alt="" fetchpriority="high" /></div>
    </div>
    <div id="root"></div>
  </body>
</html>
